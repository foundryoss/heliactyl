<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lightd WebSocket Log Viewer</title>
    <style>
        body {
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background-color: #1e1e1e;
            color: #d4d4d4;
        }
        h1 {
            color: #569cd6;
            margin-bottom: 20px;
        }
        .container {
            background: #252526;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #3c3c3c;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #9cdcfe;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #3c3c3c;
            border-radius: 4px;
            box-sizing: border-box;
            background: #1e1e1e;
            color: #d4d4d4;
            font-family: inherit;
        }
        input:focus {
            outline: none;
            border-color: #569cd6;
        }
        button {
            background: #0e639c;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 10px;
            font-family: inherit;
        }
        button:hover {
            background: #1177bb;
        }
        button:disabled {
            background: #3c3c3c;
            cursor: not-allowed;
        }
        .status {
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .status.connected {
            background: #2d4a3e;
            color: #4ec9b0;
            border: 1px solid #4ec9b0;
        }
        .status.disconnected {
            background: #4a2d2d;
            color: #f48771;
            border: 1px solid #f48771;
        }
        .status.connecting {
            background: #4a3d2d;
            color: #dcdcaa;
            border: 1px solid #dcdcaa;
        }
        .log-container {
            background: #0d0d0d;
            border: 1px solid #3c3c3c;
            border-radius: 4px;
            padding: 15px;
            height: 500px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.5;
        }
        .log-line {
            margin: 2px 0;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .log-line.stdout { color: #d4d4d4; }
        .log-line.info { color: #569cd6; }
        .log-line.error { color: #f48771; }
        .log-line.success { color: #4ec9b0; }
        .log-line.status { color: #dcdcaa; }
        .timestamp {
            color: #6a9955;
            margin-right: 10px;
        }
        #tokenInfo {
            font-size: 11px;
            color: #6a9955;
            margin-top: 10px;
        }
        .state-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 4px;
            font-weight: bold;
            margin-left: 10px;
        }
        .state-badge.running { background: #2d4a3e; color: #4ec9b0; }
        .state-badge.stopped { background: #4a2d2d; color: #f48771; }
        .state-badge.offline { background: #3c3c3c; color: #808080; }
    </style>
</head>
<body>
    <h1>🐳 lightd Log Viewer</h1>
    
    <div class="container">
        <div class="form-group">
            <label for="serverUrl">Server URL:</label>
            <input type="text" id="serverUrl" value="http://localhost:8070">
        </div>
        <div class="form-group">
            <label for="containerId">Container ID/UUID:</label>
            <input type="text" id="containerId" placeholder="Enter container UUID or Docker container ID">
        </div>
        <button onclick="generateToken()">1. Generate Token</button>
        <button onclick="connect()" id="connectBtn" disabled>2. Connect & Stream Logs</button>
        <button onclick="disconnect()" id="disconnectBtn" disabled>Disconnect</button>
        
        <div id="connectionStatus" class="status disconnected">Disconnected</div>
        <div id="tokenInfo"></div>
    </div>

    <div class="container">
        <h2>Container State: <span id="containerState" class="state-badge offline">UNKNOWN</span></h2>
    </div>

    <div class="container">
        <h2>Live Console Output</h2>
        <div id="log" class="log-container"></div>
        <button onclick="clearLog()">Clear</button>
        <span id="lineCount" style="margin-left: 15px; color: #6a9955;">0 lines</span>
    </div>

    <script>
        let ws = null;
        let token = null;
        let lineCount = 0;

        function addLogLine(message, type = 'stdout') {
            const logElement = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            
            const line = document.createElement('div');
            line.className = `log-line ${type}`;
            line.innerHTML = `<span class="timestamp">[${timestamp}]</span>${escapeHtml(message)}`;
            
            logElement.appendChild(line);
            logElement.scrollTop = logElement.scrollHeight;
            
            lineCount++;
            document.getElementById('lineCount').textContent = `${lineCount} lines`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
            lineCount = 0;
            document.getElementById('lineCount').textContent = '0 lines';
        }

        function updateConnectionStatus(status, message) {
            const statusElement = document.getElementById('connectionStatus');
            statusElement.className = `status ${status}`;
            statusElement.textContent = message;
        }

        function updateContainerState(state) {
            const stateElement = document.getElementById('containerState');
            stateElement.textContent = state.toUpperCase();
            stateElement.className = 'state-badge ' + (
                state === 'running' ? 'running' :
                state === 'stopped' || state === 'offline' ? 'stopped' : 'offline'
            );
        }

        async function generateToken() {
            const serverUrl = document.getElementById('serverUrl').value;
            const containerId = document.getElementById('containerId').value;

            if (!containerId) {
                alert('Please enter a container ID or UUID');
                return;
            }

            try {
                addLogLine(`Generating token for container: ${containerId}`, 'info');
                
                const response = await fetch(`${serverUrl}/websocket/generate?container_id=${encodeURIComponent(containerId)}`);
                const result = await response.json();
                
                if (result.success) {
                    token = result.data.token;
                    document.getElementById('tokenInfo').textContent = 
                        `Token: ${token.substring(0, 20)}... | Expires: ${new Date(result.data.expires_at).toLocaleString()}`;
                    document.getElementById('connectBtn').disabled = false;
                    addLogLine('Token generated successfully!', 'success');
                } else {
                    addLogLine(`Failed to generate token: ${result.message}`, 'error');
                }
            } catch (error) {
                addLogLine(`Error: ${error.message}`, 'error');
            }
        }

        function connect() {
            if (!token) {
                alert('Please generate a token first');
                return;
            }

            const serverUrl = document.getElementById('serverUrl').value;
            const wsUrl = serverUrl.replace('http://', 'ws://').replace('https://', 'wss://');
            
            updateConnectionStatus('connecting', 'Connecting...');
            addLogLine('Connecting to WebSocket...', 'info');

            ws = new WebSocket(`${wsUrl}/websocket?token=${token}`);

            ws.onopen = function() {
                updateConnectionStatus('connected', 'Connected - Streaming Logs');
                addLogLine('WebSocket connected! Waiting for logs...', 'success');
                document.getElementById('connectBtn').disabled = true;
                document.getElementById('disconnectBtn').disabled = false;
            };

            ws.onmessage = function(event) {
                try {
                    const message = JSON.parse(event.data);
                    
                    switch (message.event) {
                        case 'init':
                            // Init message: [container_id, container_uuid, status]
                            if (message.args && message.args.length >= 3) {
                                addLogLine(`Connected to container: ${message.args[1]}`, 'success');
                                updateContainerState(message.args[2]);
                            }
                            break;
                        case 'console_output':
                            // This is the main log output
                            if (message.args && message.args[0]) {
                                addLogLine(message.args[0], 'stdout');
                            }
                            break;
                        case 'status':
                            if (message.args && message.args[0]) {
                                updateContainerState(message.args[0]);
                                addLogLine(`Container status: ${message.args[0]}`, 'status');
                            }
                            break;
                        case 'daemon_message':
                            if (message.args && message.args[0]) {
                                addLogLine(`[daemon] ${message.args[0]}`, 'info');
                            }
                            break;
                        case 'error':
                            if (message.args && message.args[0]) {
                                addLogLine(`Error: ${message.args[0]}`, 'error');
                            }
                            break;
                        default:
                            addLogLine(`[${message.event}] ${message.args ? message.args.join(' ') : ''}`, 'info');
                    }
                } catch (e) {
                    // Raw text message
                    addLogLine(event.data, 'stdout');
                }
            };

            ws.onerror = function(error) {
                addLogLine(`WebSocket error occurred`, 'error');
            };

            ws.onclose = function(event) {
                updateConnectionStatus('disconnected', 'Disconnected');
                addLogLine(`WebSocket closed (code: ${event.code})`, 'info');
                document.getElementById('connectBtn').disabled = false;
                document.getElementById('disconnectBtn').disabled = true;
            };
        }

        function disconnect() {
            if (ws) {
                ws.close(1000, 'User disconnected');
                ws = null;
            }
        }

        // Initialize
        addLogLine('lightd Log Viewer ready', 'info');
        addLogLine('1. Enter server URL and container ID', 'info');
        addLogLine('2. Click "Generate Token" to get access', 'info');
        addLogLine('3. Click "Connect & Stream Logs" to view live logs', 'info');
    </script>
</body>
</html>
