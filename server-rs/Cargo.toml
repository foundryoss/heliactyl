[package]
name = "server-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.6", features = ["ws"] }
bcrypt = "0.16.0"
chrono = "0.4.42"
colorized = "1.0.0"
futures-util = "0.3"
jsonwebtoken = "9.3.0"
mongodb = { version = "3.1.0", default-features = true, features = ["dns-resolver"] }
once_cell = "1.21.3"
rand = "0.9.2"
redis = "0.27.6"
regex = "1.12.2"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
tower = "0.5.2"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
uuid = { version = "1.18", features = ["v4"] }
