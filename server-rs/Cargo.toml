[package]
name = "server-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.6"
bcrypt = "0.16.0"
chrono = "0.4.42"
colorized = "1.0.0"
jsonwebtoken = "9.3.0"
mongodb = { version = "3.1.0", default-features = true, features = ["dns-resolver"] }
once_cell = "1.21.3"
rand = "0.9.2"
redis = "0.27.6"
regex = "1.12.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1", features = ["full"] }
tower = "0.5.2"
tower-http = "0.6.6"
uuid = { version = "1.18", features = ["v4"] }
