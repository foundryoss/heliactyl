# Heliactyl 15 database schema (YAML -> auto-migrations)

tables:
  - name: users
    columns:
      - { name: id, type: uuid, primaryKey: true }
      - { name: email, type: string, unique: true }
      - { name: username, type: string, unique: true }
      - { name: passwordHash, type: string }
      - { name: discordId, type: string, unique: true }
      - { name: isAdmin, type: boolean, notNull: true, default: 0 }
      - { name: createdAt, type: datetime, notNull: true, default: now }
      - { name: updatedAt, type: datetime, notNull: true, default: now }
    indexes:
      - { columns: [email] }
      - { columns: [username] }
      - { columns: [discordId] }

  - name: oauth_states
    columns:
      - { name: state, type: string, primaryKey: true }
      - { name: provider, type: string, notNull: true }
      - { name: createdAt, type: datetime, notNull: true, default: now }

  - name: user_sessions
    columns:
      - { name: id, type: uuid, primaryKey: true }
      - { name: userId, type: uuid, notNull: true, references: { table: users, column: id, onDelete: CASCADE } }
      - { name: token, type: string, unique: true }
      - { name: createdAt, type: datetime, notNull: true, default: now }
      - { name: expiresAt, type: datetime, notNull: true }
      - { name: ip, type: string }
      - { name: userAgent, type: string }
    indexes:
      - { columns: [userId] }

  - name: audit_logs
    columns:
      - { name: id, type: uuid, primaryKey: true }
      - { name: userId, type: uuid, notNull: true, references: { table: users, column: id, onDelete: CASCADE } }
      - { name: tenantId, type: uuid, references: { table: tenants, column: id, onDelete: SET NULL } }
      - { name: action, type: string, notNull: true }
      - { name: actorType, type: string, notNull: true }
      - { name: ip, type: string }
      - { name: userAgent, type: string }
      - { name: metadata, type: json }
      - { name: createdAt, type: datetime, notNull: true, default: now }
    indexes:
      - { columns: [userId, createdAt] }

  - name: tenants
    columns:
      - { name: id, type: uuid, primaryKey: true }
      - { name: name, type: string, notNull: true }
      - { name: ownerUserId, type: uuid, notNull: true, references: { table: users, column: id, onDelete: CASCADE } }
      - { name: packageId, type: string, notNull: true }
      - { name: extraMemoryMb, type: int, notNull: true, default: 0 }
      - { name: extraDiskMb, type: int, notNull: true, default: 0 }
      - { name: extraCpuPercent, type: int, notNull: true, default: 0 }
      - { name: extraServerSlots, type: int, notNull: true, default: 0 }
      - { name: createdAt, type: datetime, notNull: true, default: now }
      - { name: updatedAt, type: datetime, notNull: true, default: now }
    indexes:
      - { columns: [ownerUserId] }

  - name: tenant_members
    columns:
      - { name: tenantId, type: uuid, notNull: true, references: { table: tenants, column: id, onDelete: CASCADE } }
      - { name: userId, type: uuid, notNull: true, references: { table: users, column: id, onDelete: CASCADE } }
      - { name: role, type: string, notNull: true }
    indexes:
      - { columns: [tenantId, userId], unique: true }

  - name: tenant_ptero_accounts
    columns:
      - { name: tenantId, type: uuid, primaryKey: true, references: { table: tenants, column: id, onDelete: CASCADE } }
      - { name: pteroUserId, type: int, notNull: true }
      - { name: email, type: string, notNull: true }
      - { name: encryptedPassword, type: string, notNull: true }

  - name: eggs
    columns:
      - { name: id, type: uuid, primaryKey: true }
      - { name: nestId, type: int, notNull: true }
      - { name: eggId, type: int, notNull: true }
      - { name: name, type: string, notNull: true }
      - { name: dockerImage, type: string, notNull: true }
      - { name: startup, type: string, notNull: true }
      - { name: environment, type: json }
    indexes:
      - { columns: [nestId] }
      - { columns: [eggId], unique: true }

  - name: servers
    columns:
      - { name: id, type: uuid, primaryKey: true }
      - { name: tenantId, type: uuid, notNull: true, references: { table: tenants, column: id, onDelete: CASCADE } }
      - { name: pteroServerId, type: int, notNull: true }
      - { name: pteroIdentifier, type: string, notNull: true, default: '' }
      - { name: name, type: string, notNull: true }
      - { name: eggId, type: int, notNull: true }
      - { name: dockerImage, type: string, notNull: true }
      - { name: memoryMb, type: int, notNull: true }
      - { name: diskMb, type: int, notNull: true }
      - { name: cpuPercent, type: int, notNull: true }
      - { name: locationId, type: int, notNull: true }
      - { name: createdAt, type: datetime, notNull: true, default: now }
    indexes:
      - { columns: [tenantId] }
      - { columns: [pteroIdentifier], unique: true }


